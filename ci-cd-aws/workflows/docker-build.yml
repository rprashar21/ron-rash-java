name: Docker Build & Push

# Only run when main branch is pushed
on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger for testing

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Build Docker image (locally, without pushing)
      - name: Build Docker image
        run: |
          docker build -t hello-world-app:latest .
          echo "✅ Docker image built successfully"

      # Test the Docker image
      - name: Test Docker image
        run: |
          docker run --rm hello-world-app:latest
          echo "✅ Docker container ran successfully"

      # Push to Docker Hub (requires secrets)
      # Uncomment below to enable pushing to Docker Hub
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Push to Docker Hub
      #   run: |
      #     docker tag hello-world-app:latest ${{ secrets.DOCKER_USERNAME }}/hello-world-app:latest
      #     docker push ${{ secrets.DOCKER_USERNAME }}/hello-world-app:latest
      #     echo "✅ Image pushed to Docker Hub"

      # Create a summary artifact
      - name: Create build report
        run: |
          cat > build-report.txt << 'EOF'
          Docker Build Report
          ====================
          Image: hello-world-app:latest
          Build Time: $(date)
          Status: Success
          EOF

      - name: Upload build report
        uses: actions/upload-artifact@v3
        with:
          name: docker-build-report
          path: build-report.txt
